[project]
name = "cid-reference"
version = "0.1.0"
description = "Reference implementation of Conditional Interest Discovery (CID) 0.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "jsonschema>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
