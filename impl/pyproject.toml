[project]
name = "gidp-reference"
version = "0.1.1"
description = "Reference implementation of Graduated Interest Disclosure (GIDP) 0.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]
license = "Apache-2.0"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "jsonschema>=4.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

# Only the library ships. baselines, schema, examples, tests and tools are
# the workbench: flat-layout auto-discovery sees them as packages and
# refuses to guess, which is how this was found.
[tool.setuptools.packages.find]
include = ["gidp*"]

[build-system]
requires = ["setuptools>=77"]   # SPDX string form of `license` needs 77+
build-backend = "setuptools.build_meta"

# The specification URL is the protocol identifier and must resolve for good.
[project.urls]
Specification = "https://gidp.dev"
Source = "https://github.com/FlorianWilliams/gidp"
Issues = "https://github.com/FlorianWilliams/gidp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP042 would replace `class X(str, Enum)` with `StrEnum`. The two differ in
# what `str(member)` returns, which is the text of several error messages the
# conformance tests match on and the specification quotes. The gain is
# cosmetic and the change is not; left as is, deliberately.
# E501 is left to the formatter, which wraps code at line-length and cannot
# split a long string or comment. Flagging what the formatter deliberately
# left alone is noise; `ruff format --check` is the real gate.
ignore = ["UP042", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["gidp"]
ignore_missing_imports = true
